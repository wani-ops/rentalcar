<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Transparent Signup Form HTML CSS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
    <div class="bg-img">
        <div class="content">
            <header>Signup Form</header>
            <form action="signup.php" method="post">
                <div class="field">
                    <input type="text" id="cust_ic" name="cust_ic" required placeholder="IC">
                </div>
                <div class="field space">
                    <input type="text" id="fullname" name="fullname" required placeholder="Full Name">
                </div>
                <div class="field space">
                    <input type="email" id="email" name="email" required placeholder="Email">
                </div>
                <div class="field space">
                    <input type="password" id="password" name="password" required placeholder="Password">
                </div>
                <div class="field space">
                    <input type="number" id="cust_no" name="cust_no" placeholder="Contact Number">
                </div>
                <div class="field space">
                    <input type="text" id="cust_add" name="cust_add" placeholder="Address">
                </div>
                <div class="field">
                    <button type="submit" name="signup">Sign Up</button>
                </div>
            </form>
            <div class="login">
                Already have an account?
                <a href="login_signup.html">Login Now</a>
            </div>
        </div>
    </div>
</body>
</html>
